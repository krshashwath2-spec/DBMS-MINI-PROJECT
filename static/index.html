<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a43">
  <title>ReliefFlow — Disaster response management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#" aria-label="ReliefFlow home"><span class="brand-icon">R</span><span>relief<span class="brand-light">flow</span></span></a>
      <div class="workspace-label">RESPONSE CENTER</div>
      <nav id="navigation" aria-label="Main navigation">
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon">◫</span>Overview</button>
        <div class="nav-caption">PEOPLE & INCIDENTS</div>
        <button class="nav-item" data-view="disasters"><span class="nav-icon">⌁</span>Disasters</button>
        <button class="nav-item" data-view="affected_areas"><span class="nav-icon">⌖</span>Affected areas</button>
        <button class="nav-item" data-view="affected_people"><span class="nav-icon">♙</span>Affected people</button>
        <button class="nav-item" data-view="relief_requests"><span class="nav-icon">♧</span>Relief requests</button>
        <button class="nav-item" data-view="medical_requests"><span class="nav-icon">✚</span>Medical requests</button>
        <div class="nav-caption">FIELD RESOURCES</div>
        <button class="nav-item" data-view="shelters"><span class="nav-icon">⌂</span>Shelters</button>
        <button class="nav-item" data-view="shelter_allocations"><span class="nav-icon">↗</span>Shelter allocations</button>
        <button class="nav-item" data-view="resources"><span class="nav-icon">▤</span>Resources</button>
        <button class="nav-item" data-view="inventory"><span class="nav-icon">▦</span>Inventory</button>
        <button class="nav-item" data-view="supply_distributions"><span class="nav-icon">⇢</span>Distributions</button>
        <button class="nav-item" data-view="rescue_teams"><span class="nav-icon">⚑</span>Rescue teams</button>
        <button class="nav-item" data-view="vehicles"><span class="nav-icon">▰</span>Vehicles</button>
        <div class="nav-caption">NOSQL FIELD DATA</div>
        <button class="nav-item" data-view="field_reports"><span class="nav-icon">▧</span>Field reports · MongoDB</button>
      </nav>
      <div class="sidebar-footer"><span class="online-dot"></span><span>Response network active</span></div>
    </aside>
    <main class="main-content">
      <header class="topbar"><div class="breadcrumb">Relief operations <span>/</span> <b id="breadcrumb-current">Overview</b></div><div class="topbar-right"><span class="live-indicator"><i></i> LOCAL</span><span class="avatar">RC</span></div></header>
      <section id="content" class="content" aria-live="polite"></section>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <div id="modal-root"></div>
  <script src="/app.js"></script>
</body>
</html>
